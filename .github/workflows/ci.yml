name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg://nurtelora_test:test-only-password@localhost:5432/nurtelora_test
      NURTELORA_TEST_DATABASE_URL: postgresql+psycopg://nurtelora_test:test-only-password@localhost:5432/nurtelora_test
      PHONE_HASH_SECRET: ci-only-not-a-real-secret-value
      NATLAS_ENABLED: "false"
      WHATSAPP_ENABLED: "false"

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: nurtelora_test
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: nurtelora_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nurtelora_test -d nurtelora_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install project and test dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Compile application and tests
        run: python -m compileall app tests migrations

      - name: Apply PostgreSQL migrations
        run: alembic upgrade head

      - name: Verify migration head
        run: alembic current

      - name: Run test suite
        run: python -m pytest -q

      - name: Build Docker image
        run: docker build --tag nurtelora-ci:${{ github.sha }} .
